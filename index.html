<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ledger — FinTech Demo</title>
<meta name="description" content="Ledger — a functional FinTech demo: wallet, payments, budgets, goals, merchant and admin views." />
<meta name="color-scheme" content="dark" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react/jsx-runtime": "https://esm.sh/react@18.3.1/jsx-runtime",
    "react/jsx-dev-runtime": "https://esm.sh/react@18.3.1/jsx-dev-runtime",
    "react-dom": "https://esm.sh/react-dom@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react",
    "recharts": "https://esm.sh/recharts@2.12.7?external=react,react-dom"
  }
}
</script>
<style>
  :root {
    --bg-start: #020617;
    --bg-end: #0f172a;
    --surface: rgba(15, 23, 42, 0.7);
    --surface-border: rgba(148, 163, 184, 0.24);
    --text-primary: #e2e8f0;
    --text-secondary: #94a3b8;
  }
  * { box-sizing: border-box; }
  html, body, #root { height: 100%; }
  body {
    margin: 0;
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(1200px 500px at 20% 0%, #1e293b 0%, transparent 60%), linear-gradient(145deg, var(--bg-start), var(--bg-end));
    color: var(--text-primary);
  }
  .boot-shell {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .boot-card {
    width: min(420px, 100%);
    padding: 1.25rem 1.5rem;
    border-radius: 0.9rem;
    border: 1px solid var(--surface-border);
    background: var(--surface);
    backdrop-filter: blur(8px);
    box-shadow: 0 10px 30px rgba(2, 6, 23, 0.35);
  }
  .boot-title {
    margin: 0;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 0.01em;
  }
  .boot-subtitle {
    margin: 0.45rem 0 0;
    color: var(--text-secondary);
    font-size: 0.875rem;
  }
</style>
</head>
<body>
<div id="root">
  <div class="boot-shell">
    <div class="boot-card" role="status" aria-live="polite">
      <p class="boot-title">Loading Ledger…</p>
      <p class="boot-subtitle">Initializing your FinTech dashboard.</p>
    </div>
  </div>
</div>
<noscript>
  <div class="boot-shell">
    <div class="boot-card">
      <p class="boot-title">JavaScript is required</p>
      <p class="boot-subtitle">Enable JavaScript to run this demo.</p>
    </div>
  </div>
</noscript>
<script type="module" src="./main.js"></script>
</body>
</html>
